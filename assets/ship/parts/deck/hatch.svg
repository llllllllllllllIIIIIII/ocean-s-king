        fill="#6b4f2a" stroke="#2a1c10" stroke-width="5"/>
  <rect x="26" y="26" width="68" height="68" fill="#120b04"/>
  <g stroke="#8a6a3c" stroke-width="7" stroke-linecap="round">
    <line x1="40" y1="20" x2="40" y2="100"/>
